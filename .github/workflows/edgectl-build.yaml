name: Build edgectl

on:
  # push:
  #   branches: [ main ]
  #   tags: [ "v*" ]
  # pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download deps
        run: go mod download

      - name: Build edgectl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          BIN=edgectl-${GOOS}-${GOARCH}
          [ "$GOOS" = "windows" ] && BIN=$BIN.exe

          go build \
            -ldflags="-s -w \
              -X main.version=${{ github.ref_name }} \
              -X main.commit=${{ github.sha }}" \
            -o dist/$BIN \
            ./cmd/edgectl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgectl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
