name: Build edgectl

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Download deps
        run: go mod download

      - name: Build edgectl
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          BIN=edgectl-${GOOS}-${GOARCH}
          [ "$GOOS" = "windows" ] && BIN=$BIN.exe

          go build \
            -ldflags="-s -w \
              -X main.version=${{ github.ref_name }} \
              -X main.commit=${{ github.sha }}" \
            -o dist/$BIN \
            ./cmd/edgectl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: edgectl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts (debug)
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/edgectl-*


